[project]
name = "davinci-resolve-mcp-server"
version = "1.0.0"
description = "MCP server for controlling DaVinci Resolve through its official scripting API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mcp<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resolve_mcp"]

[tool.ruff]
line-length = 100
